summary: >-
  Wideo publishes no request-rate limit for the Video Automation API. Neither the
  API documentation page nor the pricing page states a requests-per-second or
  requests-per-minute ceiling, a burst allowance, a 429 behaviour, or any
  rate-limit response header. What Wideo does publish is a monthly consumption
  quota expressed in rendering credits, which is a billing quota rather than a
  runtime rate limit — an integrator cannot tell from the published surface how
  fast they may submit batches.
