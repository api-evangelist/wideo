aid: wideo
name: Wideo
description: >-
  Wideo is an online video creation and automation platform that lets teams
  produce animated videos, presentations, and marketing content from
  drag-and-drop templates and AI tools. For developers, Wideo publishes a Video
  Automation API that renders finished MP4 videos at scale: a rendering batch is
  created from a reusable template plus a list of per-video variable objects,
  rendering runs asynchronously, and completion is delivered via a webhook
  callback and pollable batch status returning signed video and preview URLs. A
  legacy replace/encode flow supports single-video generation. Wideo also offers
  a white-label video API for embedding video creation into other products.
  Wideo was surfaced as a portfolio company of 500 Global.
