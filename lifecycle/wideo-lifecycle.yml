summary: >-
  Wideo runs a public status page but publishes no versioning policy, no
  deprecation policy and no SLA for the Video Automation API. Two generations of
  the API are live at once — the legacy /automation/replace + /automation/encode
  pair still documented on wideo.co/api/, and the newer /batch pair presented as a
  "Developer preview" on wideo.co/api-documentation/ — with nothing published that
  says whether the legacy pair is supported, frozen, or scheduled for removal.
