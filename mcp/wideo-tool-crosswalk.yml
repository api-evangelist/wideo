gaps:
- >-
  The async model does not survive a naive tool mapping. create_batch returns a
  batchId, not a video, so an agent driving these tools must either poll get_batch
  or terminate a webhook it cannot receive. Any real Wideo MCP server would need a
  wait/poll composite tool that has no REST counterpart.
- >-
  No documented failure status for a batch means an agent polling get_batch has no
  published terminal condition other than SUCCEEDED, and therefore no defined exit
  from the poll loop.
