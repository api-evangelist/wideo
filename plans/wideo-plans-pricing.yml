summary: >-
  Wideo publishes two distinct, separately priced surfaces. The Video Automation
  API is sold on its own monthly credit plans, published on the API documentation
  page, where 1 credit equals 60 seconds of generated video. The end-user Wideo
  editor is sold on a separate seat/download subscription published on the pricing
  guide. The API plans are the ones that govern programmatic access; API access is
  not self-serve — every API tier is entered through a "Request API access" form.
